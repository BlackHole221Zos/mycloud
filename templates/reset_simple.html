{% extends 'base.html' %}
{% block title %}Новый пароль - MyCloud{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="fas fa-cloud"></i>
            </div>
            <h1>MyCloud</h1>
            <p>Новый пароль для {{ username }}</p>
        </div>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i> Новый пароль
                </label>
                <input type="password" id="password" name="password" required minlength="6"
                       placeholder="Введите новый пароль">
            </div>

            <div class="form-group">
                <label for="password2">
                    <i class="fas fa-lock"></i> Повторите пароль
                </label>
                <input type="password" id="password2" name="password2" required minlength="6"
                       placeholder="Повторите новый пароль">
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-save"></i> Сохранить
            </button>
        </form>

        <div class="auth-footer">
            <p>
                <a href="{{ url_for('auth.login') }}">Перейти ко входу</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
