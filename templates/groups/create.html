{% extends 'base.html' %}
{% block title %}Создать группу{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1><i class="fas fa-users"></i> Новая группа</h1>
            <p>Создайте пространство для совместной работы</p>
        </div>

        <form method="POST" action="{{ url_for('groups.create_group') }}" class="auth-form">
            <div class="form-group">
                <label for="group_name">Название группы</label>
                <input type="text" id="group_name" name="group_name" required
                       placeholder="Например, 'Проект Х'">
            </div>

            <!-- 👇 ВЫБОР РАЗМЕРА 👇 -->
            <div class="form-group">
                <label for="storage_limit">Размер хранилища</label>
                <select name="storage_limit" id="storage_limit" class="form-control">
                    <option value="1" selected>1 ГБ</option>
                    <option value="5">5 ГБ</option>
                    <option value="10">10 ГБ</option>
                    <option value="50">50 ГБ</option>
                </select>
                <p style="font-size: 0.75rem; color: gray; margin-top: 0.25rem;">
                    Лимит места для этой группы.
                </p>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-plus-circle"></i> Создать
            </button>
            <a href="{{ url_for('groups.list_groups') }}" class="btn btn-secondary btn-block" style="margin-top: 0.5rem; text-align: center;">Отмена</a>
        </form>
    </div>
</div>

<style>
.form-control {
    width: 100%; padding: 0.75rem 1rem; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 1rem; background: white; color: #333; cursor: pointer;
}
body.dark-mode .form-control { background: #1e293b; border-color: #334155; color: #fff; }
</style>
{% endblock %}
