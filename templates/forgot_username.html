{% extends 'base.html' %}
{% block title %}Восстановление пароля - MyCloud{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="fas fa-cloud"></i>
            </div>
            <h1>MyCloud</h1>
            <p>Восстановление доступа по имени пользователя</p>
        </div>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i> Имя пользователя
                </label>
                <input type="text" id="username" name="username" required
                       placeholder="Введите имя пользователя">
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-arrow-right"></i> Далее
            </button>
        </form>

        <div class="auth-footer">
            <p>
                <a href="{{ url_for('auth.login') }}">Вернуться ко входу</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
